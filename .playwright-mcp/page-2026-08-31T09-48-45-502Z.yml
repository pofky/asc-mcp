    - generic [ref=e157]:
      - generic [ref=e158]: Setup
      - heading "Three steps, about five minutes" [level=2] [ref=e159]
      - paragraph [ref=e160]:
        - text: On Claude Desktop, skip all of it. Download
        - link "the .mcpb bundle" [ref=e161] [cursor=pointer]:
          - /url: https://github.com/pofky/asc-mcp/releases/latest
        - text: and open it. Claude installs it in one click, asks for your Issuer ID, and lets you pick your .p8 with a file picker. No config file, no restart. The steps below are for every other client.
      - list [ref=e162]:
        - listitem [ref=e163]:
          - text: Create an App Store Connect API key. In App Store Connect, open Users and Access, then Integrations, then App Store Connect API. Generate a key with the App Manager role and download the .p8. Apple only lets you download it once. Drop it in Apple's standard folder and the Key ID is read from the filename.
          - generic [ref=e164]: mv ~/Downloads/AuthKey_*.p8 ~/.appstoreconnect/private_keys/
        - listitem [ref=e165]:
          - text: Run init. It finds the key, asks for your Issuer ID and optional Pro key, and prints a paste-ready config block. Add
          - code [ref=e166]: "--write"
          - text: and it merges the block into your client config for you, after backing it up.
          - generic [ref=e167]: npx @pofky/asc-mcp init --write
        - listitem [ref=e168]:
          - text: Restart your client and check. Ask your agent to run the setup check. It verifies the key, the Issuer ID, a live authenticated call, and your license tier, and prints the exact fix for anything wrong.
          - generic [ref=e169]: npx @pofky/asc-mcp doctor
      - paragraph [ref=e170]: Works with Claude Code, Claude Desktop, Cursor, Windsurf, Cline, and any other MCP client that speaks stdio. Requires Node 18 or newer. Building and uploading a binary additionally needs a Mac with Xcode.
    - generic [ref=e172]:
      - generic [ref=e173]: FAQ
      - heading "What the App Store Connect API cannot do" [level=2] [ref=e174]
      - paragraph [ref=e175]: "This list matters more than the feature list. Anyone who tells you an agent can do all of App Store Connect has not tried these:"
      - generic [ref=e176]:
        - heading "Create an app record" [level=3] [ref=e177]
        - paragraph [ref=e178]: Forbidden for API keys. Create it once on the website, then everything after is automatable.
      - generic [ref=e179]:
        - heading "Set the App Privacy nutrition label" [level=3] [ref=e180]
        - paragraph [ref=e181]:
          - text: The data usage resource is not public.
          - code [ref=e182]: set_privacy_nutrition
          - text: returns the checklist and the deep link.
      - generic [ref=e183]:
        - heading "Declare EU trader status" [level=3] [ref=e184]
        - paragraph [ref=e185]:
          - text: No API attribute exists, and it is a legal declaration.
          - code [ref=e186]: set_eu_trader_status
          - text: returns the steps.
      - generic [ref=e187]:
        - heading "Submit an app's first in-app purchases" [level=3] [ref=e188]
        - paragraph [ref=e189]:
          - text: Apple requires the first products to be submitted with the version, which only the website can do.
          - code [ref=e190]: submit_for_review
          - text: detects this and stops rather than orphaning your version. Later products submit fine over the API.
      - generic [ref=e191]:
        - heading "Post a public reply to a review" [level=3] [ref=e192]
        - paragraph [ref=e193]:
          - text: Reading reviews is in the API, replying is not.
          - code [ref=e194]: draft_review_response
          - text: writes the reply for you to paste.
      - generic [ref=e195]:
        - heading "Use Xcode cloud signing with a least-privilege key" [level=3] [ref=e196]
        - paragraph [ref=e197]:
          - text: It fails with a permissions error.
          - code [ref=e198]: setup_app_store_signing
          - text: creates real distribution profiles and an ExportOptions.plist for manual signing instead, which works.
