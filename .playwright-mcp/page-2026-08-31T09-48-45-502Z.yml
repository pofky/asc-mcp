  - main [ref=e32]:
    - generic [ref=e34]:
      - generic [ref=e35]: The pipeline
      - heading "A release is a state machine. Here is who drives each state." [level=2] [ref=e36]
      - paragraph [ref=e37]:
        - text: App Store Connect moves a version through fixed states. Most of those transitions have an API. A few do not, and no MCP server can invent one. Amber lists the tool calls your agent makes. Red marks the stages only the website can do, and
        - code [ref=e38]: asc_guide
        - text: hands you those steps with the deep link.
      - list [ref=e39]:
        - listitem [ref=e40]:
          - generic [ref=e43]:
            - generic [ref=e44]: Manual, one time
            - heading "The app record exists" [level=3] [ref=e45]
            - paragraph [ref=e46]:
              - code [ref=e47]: POST /v1/apps
              - text: is forbidden for API keys, so the record is created once on the website.
            - paragraph [ref=e48]: ASC website > Apps > +
        - listitem [ref=e49]:
          - generic [ref=e52]:
            - generic [ref=e53]: Prepare for submission
            - heading "Metadata, price, availability, age rating" [level=3] [ref=e54]
            - paragraph [ref=e55]: Character limits are validated before the write, so Apple does not bounce it. Price equalizes to about 175 territories.
            - paragraph [ref=e56]: update_version_metadata · set_app_metadata · set_app_price · set_app_availability · set_age_rating
        - listitem [ref=e57]:
          - generic [ref=e60]:
            - generic [ref=e61]: Build processing
            - heading "Compile, sign, upload, attach" [level=3] [ref=e62]
            - paragraph [ref=e63]: Manual-signing profiles are created via the API, then the archive is built and uploaded locally with Xcode's toolchain.
            - paragraph [ref=e64]: setup_app_store_signing · build_and_archive · upload_binary · wait_for_build · attach_build
        - listitem [ref=e65]:
          - generic [ref=e68]:
            - generic [ref=e69]: Assets and products
            - heading "Screenshots, subscriptions, in-app purchases" [level=3] [ref=e70]
            - paragraph [ref=e71]: Screenshots upload per display type. Subscriptions get a group, localization, territory availability, a USA base price fanned out to every territory, and a free trial.
            - paragraph [ref=e72]: upload_screenshots · create_subscription · create_iap · set_iap_review_screenshot
        - listitem [ref=e73]:
          - generic [ref=e76]:
            - generic [ref=e77]: Manual, website only
            - heading "Privacy nutrition label and EU trader status" [level=3] [ref=e78]
            - paragraph [ref=e79]: Neither is in the public API. Both tools return the exact checklist plus the deep link instead of pretending to write them.
            - paragraph [ref=e80]: set_privacy_nutrition · set_eu_trader_status
        - listitem [ref=e81]:
          - generic [ref=e84]:
            - generic [ref=e85]: Waiting for review
            - heading "Preflight, then submit" [level=3] [ref=e86]
            - paragraph [ref=e87]: "Preflight audits the whole version and reports every blocker with the fix. If this app's first in-app purchases are pending, submit aborts on purpose: only the website can bundle those with a version."
            - paragraph [ref=e88]: release_preflight · submit_for_review
        - listitem [ref=e89]:
          - generic [ref=e92]:
            - generic [ref=e93]: Ready for sale
            - heading "Release, or roll out over 7 days" [level=3] [ref=e94]
            - paragraph [ref=e95]: Outward-facing calls require an explicit confirm flag, so an agent cannot ship to the public by accident.
            - paragraph [ref=e96]: release_version · manage_phased_release
    - generic [ref=e98]:
      - generic [ref=e99]: Answers
      - heading "Common questions, answered directly" [level=2] [ref=e100]
      - generic [ref=e101]:
        - heading "How is this different from an MCP server that wraps the API?" [level=3] [ref=e102]
        - paragraph [ref=e103]: "Wrappers expose Apple's endpoints one to one, which can mean hundreds of tools. That fills an agent's context and leaves the sequencing to it. This server ships 41 opinionated tools that each complete a job: one call sets an age rating by merging the full declaration set, one call prices a subscription across every territory and adds the trial, one call audits a version before submission."
      - generic [ref=e104]:
        - heading "What does it actually cost?" [level=3] [ref=e105]
        - paragraph [ref=e106]:
          - text: Nothing, for the first seven days. Ask your agent to run
          - code [ref=e107]: asc_start_trial
          - text: "and every tool unlocks for a week, no card, nothing to cancel. After that Pro is $9 per month through Polar, cancel any time. Six tools stay free with no asc-mcp account: the setup check, the playbook, the trial starter, listing apps, app details, and review status. The first three need nothing at all. The other three read from App Store Connect, so they need your own Apple API key, the same one every other tool here uses."
      - generic [ref=e108]:
        - heading "Where does my API key go?" [level=3] [ref=e109]
        - paragraph [ref=e110]: Nowhere. The .p8 stays on your machine, JWTs are signed locally, and calls go straight from your computer to api.appstoreconnect.apple.com. Nothing proxies through this project. The only network call it makes elsewhere is a license check that sends your license key, not your credentials.
      - generic [ref=e111]:
        - heading "Can an agent submit or release my app by mistake?" [level=3] [ref=e112]
        - paragraph [ref=e113]: "No. submit_for_review, release_version, and upload_binary each refuse to run without an explicit confirm flag, so an agent has to be told twice. Reviews are the same: the reply tool writes a draft and never posts it."
      - generic [ref=e114]:
        - heading "Has this shipped a real app?" [level=3] [ref=e115]
        - paragraph [ref=e116]: Yes. The control plane drove a 1.0 submission end to end in June 2026, including metadata, age rating, build attach, screenshots, three in-app purchase products priced across 175 territories, and the submission itself. Every limitation listed on this page was found by hitting it live, not by reading the docs.
